<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Optelsommen met score en timer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 40px;
    }
    #sum {
      font-size: 2.2rem;
      margin-bottom: 20px;
    }
    .answer-btn {
      font-size: 1.6rem;
      padding: 12px 25px;
      margin: 10px;
      cursor: pointer;
    }
    .correct {
      background-color: #4caf50;
      color: white;
    }
    .wrong {
      background-color: #f44336;
      color: white;
    }
    #score, #timer {
      font-size: 1.4rem;
      margin: 10px;
    }
  </style>
</head>
<body>

  <h1>Optelsommen met vraagteken</h1>

  <div id="score">Score: 0</div>
  <div id="timer">Tijd: 0 sec</div>

  <div id="sum">5 + ? = 9</div>
  <div id="answers"></div>

  <script>
    let score = 0;
    let time = 0;

    setInterval(() => {
      time++;
      document.getElementById("timer").textContent = "Tijd: " + time + " sec";
    }, 1000);

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateSum() {
      const a = randomInt(1, 10);
      const x = randomInt(1, 10);
      const b = a + x;

      const sumText = a + " + ? = " + b;
      document.getElementById("sum").textContent = sumText;

      const correctAnswer = x;
      const answersDiv = document.getElementById("answers");
      answersDiv.innerHTML = "";

      const options = new Set();
      options.add(correctAnswer);
      while (options.size < 4) {
        const wrong = randomInt(1, 10);
        if (wrong !== correctAnswer) {
          options.add(wrong);
        }
      }

      const shuffled = Array.from(options).sort(() => Math.random() - 0.5);

      shuffled.forEach(value => {
        const btn = document.createElement("button");
        btn.textContent = value;
        btn.className = "answer-btn";

        btn.onclick = function () {
          document.querySelectorAll(".answer-btn").forEach(b => {
            b.classList.remove("correct", "wrong");
          });

          if (value === correctAnswer) {
            btn.classList.add("correct");
            score++;
            document.getElementById("score").textContent = "Score: " + score;
            setTimeout(generateSum, 700);
          } else {
            btn.classList.add("wrong");
          }
        };

        answersDiv.appendChild(btn);
      });
    }

    generateSum();
  </script>

</body>
</html>
