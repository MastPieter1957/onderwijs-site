<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Onderwijs Startpagina</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Welkom op de Onderwijs Startpagina</h1>

<div class="menu">
    <button class="main-btn" onclick="toonBasis()">Basis onderwijs</button>
    <button class="main-btn" onclick="toonVoortgezet()">Voortgezet onderwijs</button>
</div>

<!-- Submenu voor Basis Onderwijs -->
<div id="basis-submenu" class="submenu hidden">
    <button>Groep 3</button>
    <button>Groep 4</button>
    <button>Groep 5</button>
    <button>Groep 6</button>
</div>

<!-- Submenu voor Voortgezet Onderwijs -->
<div id="voortgezet-submenu" class="submenu hidden">
    <button>Klas 1</button>
    <button>Klas 2</button>
    <button>Klas 3</button>
</div>

<script>
function toonBasis() {
    document.getElementById("basis-submenu").classList.toggle("hidden");
}

function toonVoortgezet() {
    document.getElementById("voortgezet-submenu").classList.toggle("hidden");
}
</script>

</body>
</html>
